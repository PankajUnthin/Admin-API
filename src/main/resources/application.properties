# =====================================================================
# ===================  NIKSHAY PORTAL INTEGRATION  ====================
# =====================================================================

# ---- Master switch ----
nikshay.portal.enabled=false
nikshay.portal.active-environment=UAT
nikshay.uat.sso-base=https://sso.beta.nikshay.in
nikshay.uat.origin=https://beta.nikshay.in
nikshay.uat.client-id=29
nikshay.production.sso-base=https://sso.nikshay.in
nikshay.production.origin=https://www.nikshay.in
nikshay.production.client-id=29

# ---------- HTTP ----------
nikshay.http.connect-timeout-ms=15000
nikshay.http.read-timeout-ms=60000
nikshay.http.user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36

# ---------- SSO login form (VERIFY against one captured UAT login) ----------
nikshay.sso.username-field=username
nikshay.sso.password-field=password
nikshay.sso.captcha-field=captcha
nikshay.sso.client-id-field=clientId
nikshay.sso.encrypted-flag-field=isEncryptedData
nikshay.sso.external-login-field=isExternalLogin
nikshay.sso.return-url-field=returnUrl
nikshay.sso.form-action=
nikshay.sso.login-retry-count=2

# ---------- device password decryption (32-byte AES key, Base64) ----------
nikshay.credential.key-base64=${NIKSHAY_CREDENTIAL_KEY_BASE64:}

# ---------- transfer out ----------
nikshay.transfer.batch-size=200
nikshay.transfer.max-attempts=3
nikshay.transfer.call-delay-ms=500
nikshay.transfer.reason=Transfer to catchment PHI
# Text-match fallback for positive results. MySQL REGEXP_LIKE (ICU), case-insensitive, partial match.
# NAAT positive = mentions "detected" but does not START with "(MTB) not detected"
#   -> "MTB Detected", "MTB detected, Rif not detected", "M.Tb detected Rif indeterminate" are positive
#   -> "MTB Not Detected", "Not Detected", "Error", "Invalid", "No result" are not
nikshay.transfer.naat-positive-regex=\\bdetected\\b
nikshay.transfer.naat-negative-regex=^\\s*(m\\.?\\s*tb\\.?\\s*)?not\\s+detected
# X-ray positive = "Suggestive of TB" but not "Not Suggestive of TB"
nikshay.transfer.xray-positive-regex=suggestive
nikshay.transfer.xray-negative-regex=not\\s+suggestive

